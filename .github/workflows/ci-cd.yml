name: IC CRM CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  frontend-ci:
    name: Frontend CI (Next.js 15)
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "postgresql://postgres:password@localhost:5432/iccrm_db?schema=public"
      JWT_SECRET: "dummy_ci_secret"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Generate Prisma Client
        run: |
          cd frontend
          npx prisma generate

      - name: Next.js ESLint Check
        run: |
          cd frontend
          npm run lint

      - name: TypeScript Type Check
        run: |
          cd frontend
          npx tsc --noEmit

      - name: Build Next.js Web App
        run: |
          cd frontend
          npm run build

  backend-ci:
    name: Backend CI (Express & Integration Tests)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: iccrm_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: "postgresql://postgres:password@localhost:5432/iccrm_db?schema=public"
      JWT_SECRET: "ci_secret_test_key_12345"
      NODE_ENV: "test"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        run: |
          cd backend
          npm ci

      - name: Validate Prisma Schema
        run: |
          cd backend
          npx prisma validate

      - name: Generate Prisma Client
        run: |
          cd backend
          npx prisma generate

      - name: Push Database Schema to Postgres
        run: |
          cd backend
          npx prisma db push --skip-generate

      - name: TypeScript Type Check
        run: |
          cd backend
          npx tsc --noEmit

      - name: Run Backend Integration Test Suite
        run: |
          cd backend
          npm test

      - name: Build Express API Server
        run: |
          cd backend
          npm run build


