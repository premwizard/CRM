name: IC CRM CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  frontend-build:
    name: Frontend CI (Next.js 15)
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy?schema=public"
      JWT_SECRET: "dummy_ci_secret"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Generate Prisma Client
        run: |
          cd frontend
          npx prisma generate

      - name: TypeScript Type Check
        run: |
          cd frontend
          npx tsc --noEmit

  backend-build:
    name: Backend CI (Express Node.js)
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy?schema=public"
      JWT_SECRET: "dummy_ci_secret"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        run: |
          cd backend
          npm ci

      - name: Validate Prisma Schema
        run: |
          cd backend
          npx prisma validate

      - name: TypeScript Type Check
        run: |
          cd backend
          npx tsc --noEmit
